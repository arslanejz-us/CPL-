<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Premium folding cartons for retail and food packaging solutions.">
  <title>Folding Cartons | Custom Packaging Lane</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-category="folding-cartons">
  <div id="site-header"></div>
  <main>
    <section class="category-hero">
      <div class="category-hero__bg" aria-hidden="true">
        <img src="../assets/images/product-categories-background.webp" alt="">
      </div>
      <div class="container-xl px-4 category-hero__inner">
        <div class="row g-4 align-items-start">
          <div class="col-lg-6 d-none d-lg-block" aria-hidden="true"></div>
          <div class="col-12 col-lg-6 category-hero__content">
            <nav class="category-breadcrumb" aria-label="Breadcrumb">
              <a href="../index.html">Home</a><span>/</span><span id="categoryBreadcrumb">Folding Cartons</span>
            </nav>
            <h1 class="category-hero__title" id="categoryHeroTitle">Folding Cartons</h1>
            <p class="category-hero__desc" id="categoryHeroDesc">Premium folding cartons for retail and food packaging. Customizable designs with superior print quality.</p>
            <form class="category-hero-form" data-ajax-form data-form-type="category-hero" novalidate>
              <div class="row g-2">
                <div class="col-sm-6"><input type="text" class="form-control" name="Last_Name" placeholder="Name" required></div>
                <div class="col-sm-6"><input type="email" class="form-control" name="Email" placeholder="Email" required></div>
                <div class="col-sm-6"><input type="tel" class="form-control" name="Phone" placeholder="Phone" required></div>
                <div class="col-sm-6"><input type="text" class="form-control" name="Total_Quantity" placeholder="Quantity"></div>
                <div class="col-12"><textarea class="form-control" name="Description" rows="2" placeholder="Provide Packaging Details"></textarea></div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="sms_consent" id="heroSmsConsent">
                    <label class="form-check-label small text-secondary" for="heroSmsConsent">I consent to receive SMS updates</label>
                  </div>
                </div>
                <div class="col-12"><button type="submit" class="btn btn-brand px-5">Get a Quote</button></div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
    <div id="categoryMain"></div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/form-submit.js"></script>
  <script src="../js/quote-modal.js"></script>
  <script src="../js/category-pages-data.js"></script>
  <script src="../js/category-page.js"></script>
</body>
</html>
